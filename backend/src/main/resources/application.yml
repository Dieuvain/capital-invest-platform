spring:
  application:
    name: capital-invest-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/capital_invest}
    username: ${DB_USER:capital}
    password: ${DB_PASSWORD:capital}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

capital-invest:
  # Les simulateurs remplacent les partenaires (mobile money, processeur) tant
  # que les contrats ne sont pas signés. A désactiver en production.
  simulators-enabled: ${SIMULATORS_ENABLED:true}
  security:
    # Secret de hachage des codes SMS. A fournir par variable d'environnement en production.
    otp-secret: ${OTP_SECRET:dev-only-change-me}
    otp-ttl-minutes: 5
    otp-max-attempts: 5
    otp-max-per-10-minutes: 3
    pin-max-attempts: 5
    pin-lock-minutes: 15
    session-idle-minutes: 15
    session-max-hours: 12
  # Plafonds par niveau KYC, en centimes de dollar. Valeurs PROVISOIRES,
  # à valider par la conformité avant la mise en production.
  limits:
    timezone: Africa/Lubumbashi
    pin-reset-cooldown-hours: 24
    tiers:
      1: { per-transaction-minor: 20000,  daily-out-minor: 60000,   max-balance-minor: 100000 }   # 200 $, 600 $/jour, 1 000 $
      2: { per-transaction-minor: 400000, daily-out-minor: 1000000, max-balance-minor: 2000000 }  # 4 000 $, 10 000 $/jour, 20 000 $
  # Frais d'envoi entre clients. Valeurs PROVISOIRES, à fixer par la direction générale.
  fees:
    transfer-bps: 100        # 1 % du montant
    transfer-min-minor: 10   # au moins 0,10 $
    transfer-max-minor: 500  # au plus 5 $
  # Passage au KYC 2.
  kyc:
    # Clé AES-256 (base64, 32 octets) de chiffrement des pièces d'identité. A fournir en production.
    encryption-key: ${KYC_ENCRYPTION_KEY:ZGV2LW9ubHktY2hhbmdlLW1lLWRldi1vbmx5LWtleSE=}
    max-file-bytes: 5242880
    minimum-age: 18
  backoffice:
    # Premier administrateur, créé au démarrage s'il n'existe aucun agent.
    bootstrap-admin-email: ${BACKOFFICE_ADMIN_EMAIL:}
    bootstrap-admin-password: ${BACKOFFICE_ADMIN_PASSWORD:}
