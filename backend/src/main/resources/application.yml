spring:
  application:
    name: capital-invest-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/capital_invest}
    username: ${DB_USER:capital}
    password: ${DB_PASSWORD:capital}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

capital-invest:
  # Les simulateurs remplacent les partenaires (mobile money, processeur) tant
  # que les contrats ne sont pas signés. A désactiver en production.
  simulators-enabled: ${SIMULATORS_ENABLED:true}
  security:
    # Secret de hachage des codes SMS. A fournir par variable d'environnement en production.
    otp-secret: ${OTP_SECRET:dev-only-change-me}
    otp-ttl-minutes: 5
    otp-max-attempts: 5
    otp-max-per-10-minutes: 3
    pin-max-attempts: 5
    pin-lock-minutes: 15
    session-idle-minutes: 15
    session-max-hours: 12
  # Plafonds par niveau KYC, en centimes de dollar. Valeurs PROVISOIRES,
  # à valider par la conformité avant la mise en production.
  limits:
    timezone: Africa/Lubumbashi
    pin-reset-cooldown-hours: 24
    tiers:
      1: { per-transaction-minor: 20000,  daily-out-minor: 60000,   max-balance-minor: 100000 }   # 200 $, 600 $/jour, 1 000 $
      2: { per-transaction-minor: 400000, daily-out-minor: 1000000, max-balance-minor: 2000000 }  # 4 000 $, 10 000 $/jour, 20 000 $
  # Frais d'envoi entre clients. Valeurs PROVISOIRES, à fixer par la direction générale.
  fees:
    transfer-bps: 100        # 1 % du montant
    transfer-min-minor: 10   # au moins 0,10 $
    transfer-max-minor: 500  # au plus 5 $
  # Paiement chez un marchand par QR : le client ne paie rien, le marchand paie une commission.
  merchants:
    default-commission-bps: 100  # 1 %, PROVISOIRE : à fixer par la direction générale
    # Chaque nuit, ce qui est dû part vers le compte de reversement de chaque marchand (à partir de 10,00 $).
    auto-payout-enabled: true
    auto-payout-min-minor: 1000
    auto-payout-cron: "0 30 1 * * *"  # heure de Lubumbashi, avant le rapprochement de 2 h
  # Passage au KYC 2.
  kyc:
    # Clé AES-256 (base64, 32 octets) de chiffrement des pièces d'identité. A fournir en production.
    encryption-key: ${KYC_ENCRYPTION_KEY:ZGV2LW9ubHktY2hhbmdlLW1lLWRldi1vbmx5LWtleSE=}
    max-file-bytes: 5242880
    minimum-age: 18
  backoffice:
    # Premier administrateur, créé au démarrage s'il n'existe aucun agent.
    bootstrap-admin-email: ${BACKOFFICE_ADMIN_EMAIL:}
    bootstrap-admin-password: ${BACKOFFICE_ADMIN_PASSWORD:}
    # Domaines de l'écran back-office, séparés par des virgules. Vide : même domaine que l'API.
    allowed-origins: ${BACKOFFICE_ALLOWED_ORIGINS:}
  # Opérateurs mobile money. Chaque opérateur passe par un prestataire : PAWAPAY (agrégateur),
  # SIMULATOR (développement), ou plus tard un connecteur direct. En production, les trois routes
  # sont obligatoires puisque le simulateur est désactivé.
  mobile-money:
    routes:
      MPESA: ${MOBILE_MONEY_ROUTE_MPESA:SIMULATOR}
      AIRTEL: ${MOBILE_MONEY_ROUTE_AIRTEL:SIMULATOR}
      ORANGE: ${MOBILE_MONEY_ROUTE_ORANGE:SIMULATOR}
    first-check-seconds: 10        # première relecture du statut, puis l'intervalle double…
    max-check-interval-seconds: 300 # …jusqu'à 5 minutes
    not-found-timeout-minutes: 30  # inconnue de l'opérateur après 30 min : échec
    review-after-hours: 24         # sans réponse sûre après 24 h : à vérifier par un agent
    poll-delay-ms: 5000
    reconciliation-cron: "0 0 2 * * *"  # chaque nuit à 2 h, heure de Lubumbashi
    pawapay:
      base-url: ${PAWAPAY_BASE_URL:https://api.sandbox.pawapay.io}
      api-token: ${PAWAPAY_API_TOKEN:}
      require-signed-callbacks: ${PAWAPAY_REQUIRE_SIGNED_CALLBACKS:true}
      # Domaine public appelé par pawaPay, s'il diffère de l'en-tête Host vu par l'API (proxy).
      callback-authority: ${PAWAPAY_CALLBACK_AUTHORITY:}
