spring:
  application:
    name: capital-invest-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/capital_invest}
    username: ${DB_USER:capital}
    password: ${DB_PASSWORD:capital}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

capital-invest:
  # Les simulateurs remplacent les partenaires (mobile money, processeur) tant
  # que les contrats ne sont pas signés. A désactiver en production.
  simulators-enabled: ${SIMULATORS_ENABLED:true}
  security:
    # Secret de hachage des codes SMS. A fournir par variable d'environnement en production.
    otp-secret: ${OTP_SECRET:dev-only-change-me}
    otp-ttl-minutes: 5
    otp-max-attempts: 5
    otp-max-per-10-minutes: 3
    pin-max-attempts: 5
    pin-lock-minutes: 15
    session-idle-minutes: 15
    session-max-hours: 12
  # Plafonds par niveau KYC, en centimes de dollar. Valeurs PROVISOIRES,
  # à valider par la conformité avant la mise en production.
  limits:
    timezone: Africa/Lubumbashi
    pin-reset-cooldown-hours: 24
    tiers:
      1: { per-transaction-minor: 10000,  daily-out-minor: 30000,  max-balance-minor: 50000 }    # 100 $, 300 $/jour, 500 $
      2: { per-transaction-minor: 200000, daily-out-minor: 500000, max-balance-minor: 1000000 }  # 2 000 $, 5 000 $/jour, 10 000 $
