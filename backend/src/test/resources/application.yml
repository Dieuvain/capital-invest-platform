spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/capital_invest_test}
    username: ${DB_USER:capital}
    password: ${DB_PASSWORD:capital}
capital-invest:
  simulators-enabled: true
  security:
    otp-secret: test-secret
  backoffice:
    allowed-origins: https://backoffice.capitalinvest.test
  kyc:
    encryption-key: dGVzdC1vbmx5LWtleS10ZXN0LW9ubHkta2V5LTMyYiE=
    simulated-watchlist:
      - Mutombo Fictif Sanction
  mobile-money:
    # Les tests déclenchent eux-mêmes relances et rapprochement.
    poller-enabled: false
    reconciliation-enabled: false
  notifications:
    # Les SMS partent dès la fin de chaque opération ; les tests déclenchent eux-mêmes les relances.
    dispatcher-enabled: false
  merchants:
    # Les tests lancent eux-mêmes les reversements automatiques.
    auto-payout-enabled: false
  airtime:
    # Les tests relancent eux-mêmes les achats sans réponse.
    poller-enabled: false
  bills:
    poller-enabled: false
